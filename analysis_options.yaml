include: package:flutter_lints/flutter.yaml

# `import_rules` — Analyzer-плагин, поэтому он настраивается на верхнем уровне,
# а не в `analyzer.plugins`. Для него нужны Dart 3.10+ / Flutter 3.38+.
plugins:
  import_rules: ^0.0.8
  riverpod_lint: ^3.1.8

analyzer:
  exclude:
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    discarded_futures: error
    unawaited_futures: error

# Границы импортов из целевой архитектуры в docs/TARGET_ARCHITECTURE.md.
# Правила сопоставляют физические пути, включая relative imports: изменить вид
# импорта и обойти ограничение нельзя.
import_rules:
  # Нарушения архитектуры — ошибки и в IDE, и при `dart analyze`.
  severity: error
  rules:
    # Domain — чистый business code. Data реализует его контракты, UI их
    # использует, а app собирает приложение; domain не зависит ни от одного
    # из этих слоёв.
    - target: lib/src/domain/**
      disallow:
        - lib/src/data/**
        - lib/src/ui/**
        - lib/src/app/**
      reason: >
        Domain определяет сущности, policies, use cases и repository-контракты;
        ему нельзя зависеть от implementations, presentation или composition root.

    # Framework и infrastructure packages также запрещены в domain. Так
    # entities, policies, use cases и repository-контракты остаются переносимыми
    # и независимо тестируемыми.
    - target: lib/src/domain/**
      disallow:
        - package:flutter/**
        - package:flutter_riverpod/**
        - package:dio/**
        - package:drift/**
      reason: >
        Domain не зависит от framework и infrastructure, поэтому его можно
        использовать и тестировать без Flutter, Riverpod, HTTP и persistence.

    # Data — единственный владелец transport, persistence, cache и platform
    # adapters. Зависимость от UI инвертирует поток данных и привязывает
    # repository implementation к экрану или controller.
    - target: lib/src/data/**
      disallow: lib/src/ui/**
      reason: >
        Data владеет transport, persistence, cache и platform adapters; он не
        зависит от UI controllers, widgets или view state.

    # MattermostApi — raw DTO transport boundary. Mapping в domain entities
    # выполняют repositories/mappers уровнем выше, но не data/api.
    - target: lib/src/data/api/**
      disallow: lib/src/domain/**
      reason: >
        Raw MattermostApi работает только с request/response DTO. Domain mapping
        и data policies принадлежат repository implementations и mappers.

    # UI получает domain-typed repository contracts через публичные handles
    # data providers, но не знает concrete implementations и infrastructure:
    # API, DTO, database, cache, storage и platform code.
    - target: lib/src/ui/**
      disallow: lib/src/data/**
      exclude_disallow: lib/src/data/providers/**
      reason: >
        UI использует только публичные domain-typed repository-provider handles;
        ему нельзя импортировать concrete data implementations или infrastructure.

    # `ui/core` — generic design-system layer. В отличие от остальных UI
    # сценариев, ему нельзя зависеть от domain data и даже разрешённого моста
    # repository providers, иначе generic widgets получат Mattermost semantics.
    - target: lib/src/ui/core/**
      disallow:
        - lib/src/domain/**
        - lib/src/data/**
      reason: >
        ui/core — generic design-system layer и не получает Mattermost domain
        semantics или зависимость от repository providers.

    # App — composition root: он может подключать public provider handles,
    # маршрутизировать к UI и применять theme/localization. Но он не проникает
    # в data internals: endpoints, repositories, caches и persistent storage.
    - target: lib/src/app/**
      disallow: lib/src/data/**
      exclude_disallow: lib/src/data/providers/**
      reason: >
        App — composition root и может импортировать public provider wiring, но
        endpoint, repository, cache, database и storage internals остаются data-owned.

linter:
  rules:
    always_use_package_imports: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    prefer_final_locals: true
    sort_constructors_first: true
    use_build_context_synchronously: true
