include: package:flutter_lints/flutter.yaml

# `import_rules` is an analyzer plugin, so it is configured at the top level,
# not in `analyzer.plugins`. It requires Dart 3.10+ / Flutter 3.38+.
plugins:
  import_rules: ^0.0.8
  riverpod_lint: ^3.1.8

analyzer:
  exclude:
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    discarded_futures: error
    unawaited_futures: error

# Import boundaries documented in docs/features/readme.md.
# Rules match physical paths, including relative imports. Changing the import
# form cannot bypass a restriction.
import_rules:
  # Architecture violations are errors both in the IDE and in `dart analyze`.
  severity: error
  rules:
    # Domain contains pure business code. Data implements its contracts, UI
    # uses them, and app composes the application; domain depends on none of
    # these layers.
    - target: lib/src/domain/**
      disallow:
        - lib/src/data/**
        - lib/src/ui/**
        - lib/src/app/**
      reason: >
        Domain defines entities, policies, use cases, and repository contracts;
        it must not depend on implementations, presentation, or the composition root.

    # Framework and infrastructure packages are also forbidden in domain. This
    # keeps entities, policies, use cases, and repository contracts portable
    # and independently testable.
    - target: lib/src/domain/**
      disallow:
        - package:flutter/**
        - package:flutter_riverpod/**
        - package:dio/**
        - package:drift/**
      reason: >
        Domain does not depend on framework or infrastructure, so it can be
        used and tested without Flutter, Riverpod, HTTP, or persistence.

    # Data is the sole owner of transport, persistence, cache, and platform
    # adapters. Depending on UI reverses data flow and couples a repository
    # implementation to a screen or controller.
    - target: lib/src/data/**
      disallow: lib/src/ui/**
      reason: >
        Data owns transport, persistence, cache, and platform adapters; it does
        not depend on UI controllers, widgets, or view state.

    # MattermostApi is the raw DTO transport boundary. Repositories and mappers
    # at a higher level map DTOs to domain entities, not data/api.
    - target: lib/src/data/api/**
      disallow: lib/src/domain/**
      reason: >
        Raw MattermostApi works only with request and response DTOs. Domain
        mapping and data policies belong to repository implementations and mappers.

    # UI receives domain-typed repository contracts through public data-provider
    # handles, but does not know concrete implementations or infrastructure:
    # API, DTOs, database, cache, storage, and platform code.
    - target: lib/src/ui/**
      disallow: lib/src/data/**
      exclude_disallow: lib/src/data/providers/**
      reason: >
        UI uses only public domain-typed repository-provider handles; it must
        not import concrete data implementations or infrastructure.

    # `ui/core` is a generic design-system layer. Unlike other UI flows, it
    # cannot depend on domain data or even the allowed repository-provider
    # bridge; otherwise, generic widgets would acquire Mattermost semantics.
    - target: lib/src/ui/core/**
      disallow:
        - lib/src/domain/**
        - lib/src/data/**
      reason: >
        ui/core is a generic design-system layer and must not acquire Mattermost
        domain semantics or dependencies on repository providers.

    # App is the composition root: it can wire public provider handles, route
    # to UI, and apply theme and localization. It does not access data internals:
    # endpoints, repositories, caches, or persistent storage.
    - target: lib/src/app/**
      disallow: lib/src/data/**
      exclude_disallow: lib/src/data/providers/**
      reason: >
        App is the composition root and may import public provider wiring, but
        endpoint, repository, cache, database, and storage internals remain data-owned.

linter:
  rules:
    always_use_package_imports: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    prefer_final_locals: true
    sort_constructors_first: true
    use_build_context_synchronously: true
