name: mattermost_flutter
description: Network-first, cross-platform Mattermost client written in Flutter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.31.0
  file_saver: ^0.4.0
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_cache_manager: ^3.4.2
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.0
  highlight: ^0.7.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  markdown: ^7.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.31.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  riverpod_lint: ^3.1.8

flutter:
  uses-material-design: true
